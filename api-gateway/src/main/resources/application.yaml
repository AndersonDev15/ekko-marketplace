server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: api-gateway

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:ekko-bff}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ekko}

  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            connect-timeout: 5000
            response-timeout: 10s

          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_URL:http://localhost:4200}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          routes:

            - id: keycloak-userinfo-test
              uri: http://localhost:8180
              predicates:
                - Path=/test/relay
              filters:
                - SetPath=/realms/ekko/protocol/openid-connect/userinfo

            - id: seller-service
              uri: lb://seller-service
              predicates:
                - Path=/api/sellers/**,/api/admin/sellers/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: seller-cb
                    fallbackUri: forward:/fallback/sellers
                - StripPrefix=1

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/seller/products/**,/api/admin/products/**,/api/admin/categories/**,/api/admin/brands/**,/api/catalog/products/**,/api/categories/**,/api/brands/**,/api/seller/variants/**,/api/internal/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: product-cb
                    fallbackUri: forward:/fallback/products
                - StripPrefix=1

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders,/api/orders/**,/api/admin/orders,/api/admin/orders/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: order-cb
                    fallbackUri: forward:/fallback/orders
                - StripPrefix=1

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**,/api/admin/payments/**,/api/vendor-accounts/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: payment-cb
                    fallbackUri: forward:/fallback/payments
                - StripPrefix=1

            - id: stripe-webhook
              uri: lb://payment-service
              predicates:
                - Path=/webhooks/stripe

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/reviews/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: review-cb
                - StripPrefix=1

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - TokenRelay
                - name: CircuitBreaker
                  args:
                    name: notification-cb
                - StripPrefix=1

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

    instances:
      seller-cb:
        base-config: default
      product-cb:
        base-config: default
      order-cb:
        base-config: default
      payment-cb:
        base-config: default
      review-cb:
        base-config: default
      notification-cb:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 10s

    instances:
      seller-cb:
        base-config: default
      product-cb:
        base-config: default
      order-cb:
        base-config: default
      payment-cb:
        base-config: default
      review-cb:
        base-config: default
      notification-cb:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG
