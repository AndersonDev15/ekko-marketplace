
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ekko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ekko/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: DB_HOST
              value: payment-db
            - name: DB_PORT
              value: "5432"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx320m"
          envFrom:
            - configMapRef:
                name: ekko-app-config
            - secretRef:
                name: ekko-db-secret
            - secretRef:
                name: rabbitmq-secret
            - secretRef:
                name: stripe-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ekko
spec:
  selector:
    app: payment-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
