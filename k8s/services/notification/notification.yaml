
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ekko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ekko/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: DB_HOST
              value: notification-db
            - name: DB_PORT
              value: "5432"
            - name: MAIL_HOST
              value: smtp.gmail.com
            - name: MAIL_PORT
              value: "587"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx320m"
          envFrom:
            - configMapRef:
                name: ekko-app-config
            - secretRef:
                name: ekko-db-secret
            - secretRef:
                name: rabbitmq-secret
            - secretRef:
                name: notification-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ekko
spec:
  selector:
    app: notification-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
