
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ekko-ingress
  namespace: ekko
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - api.ekko.local
        - auth.ekko.local
        - files.ekko.local
        - minio.ekko.local
      secretName: ekko-tls

  ingressClassName: nginx
  rules:
    - host: api.ekko.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

    - host: auth.ekko.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

    - host: files.ekko.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000

    - host: minio.ekko.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
