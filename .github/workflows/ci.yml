name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-gateway/pom.xml

      - name: Run tests
        working-directory: api-gateway
        run: ./mvnw -B test

  eureka-server:
    name: Eureka Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
