
services:
  # ---------------- Infraestructura ----------------

  keycloak-db:
    image: postgres:16-alpine
    container_name: ekko-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ekko-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - ekko-network

  redis:
    image: redis:7.2-alpine
    container_name: ekko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ekko-network

  minio:
    image: minio/minio:latest
    container_name: ekko-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ekko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: ekko-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ekko-network

  # ---------------- Bases de datos por servicio ----------------

  seller-db:
    image: postgres:16-alpine
    container_name: ekko-seller-db
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - seller_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d seller_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  product-db:
    image: postgres:16-alpine
    container_name: ekko-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  order-db:
    image: postgres:16-alpine
    container_name: ekko-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  payment-db:
    image: postgres:16-alpine
    container_name: ekko-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  review-db:
    image: postgres:16-alpine
    container_name: ekko-review-db
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - review_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d review_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  notification-db:
    image: postgres:16-alpine
    container_name: ekko-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  identity-db:
    image: postgres:16-alpine
    container_name: ekko-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  # ---------------- Service discovery ----------------

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: ekko-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ekko-network

  # ---------------- Microservicios (escalables) ----------------
  # Sin container_name ni "ports" fijo: ambos impiden correr más de una
  # réplica. Se usa "expose" porque el gateway habla con ellos por la red
  # interna vía lb://<servicio> (Eureka + LoadBalancer), no necesitan
  # puerto publicado al host.
  #
  # IMPORTANTE: cada servicio necesita en su application.yml:
  #   eureka:
  #     instance:
  #       instance-id: ${spring.application.name}:${random.value}
  # para que Eureka distinga cada réplica como una instancia separada.
  #
  # Para escalar: docker compose up --scale seller-service=2 -d

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile

    env_file:
    - ./identity-service/.env

    environment:
      DB_HOST: identity-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8087"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      identity-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - ekko-network

  seller-service:
    build:
      context: ./seller-service
      dockerfile: Dockerfile
    
    env_file:
    - ./seller-service/.env

    environment:
      DB_HOST: seller-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      seller-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile

    env_file:
    - ./product-service/.env

    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      product-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile

    env_file:
    - ./order-service/.env

    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      order-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    env_file:
    - ./payment-service/.env

    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      payment-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile

    env_file:
    - ./review-service/.env

    environment:
      DB_HOST: review-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      review-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    env_file:
    - ./notification-service/.env
      
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    expose:
      - "8086"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 480s
    depends_on:
      notification-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ekko-network

  # ---------------- API Gateway ----------------

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ekko-api-gateway
    environment:
      EUREKA_HOST: eureka-server
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ekko
      KEYCLOAK_CLIENT_ID: ekko-bff
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      seller-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - ekko-network

volumes:
  keycloak_data:
  redis_data:
  seller_data:
  product_data:
  order_data:
  payment_data:
  review_data:
  notification_data:
  rabbitmq_data:
  minio_data:
  identity_data:

networks:
  ekko-network:
    driver: bridge