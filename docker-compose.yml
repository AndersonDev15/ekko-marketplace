version: "3.9"

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: ekko-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ekko-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - ekko-network

  redis:
    image: redis:7.2-alpine
    container_name: ekko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ekko-network

  minio:
    image: minio/minio:latest
    container_name: ekko-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ekko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  seller-db:
    image: postgres:16-alpine
    container_name: ekko-seller-db
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - seller_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d seller_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  product-db:
    image: postgres:16-alpine
    container_name: ekko-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  order-db:
    image: postgres:16-alpine
    container_name: ekko-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  payment-db:
    image: postgres:16-alpine
    container_name: ekko-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  review-db:
    image: postgres:16-alpine
    container_name: ekko-review-db
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - review_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d review_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  notification-db:
    image: postgres:16-alpine
    container_name: ekko-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  identity-db:
    image: postgres:16-alpine
    container_name: ekko-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekko-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: ekko-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ekko-network

volumes:
  keycloak_data:
  redis_data:
  seller_data:
  product_data:
  order_data:
  payment_data:
  review_data:
  notification_data:
  rabbitmq_data:
  minio_data:
  identity_data:

networks:
  ekko-network:
    driver: bridge
