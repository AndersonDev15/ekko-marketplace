server:
  port: 8084
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: payment-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/payment_db
    username: ${DB_USER:ekko}
    password: ${DB_PASSWORD:ekko123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ekko}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ekko}
    password: ${RABBITMQ_PASSWORD:ekko123}

stripe:
  api-key: ${STRIPE_API_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

app:
  stripe-onboarding:
    refresh-url: ${STRIPE_ONBOARDING_REFRESH_URL:http://localhost:8080/api/vendor-accounts/onboarding/refresh}
    return-url: ${STRIPE_ONBOARDING_RETURN_URL:http://localhost:8080/api/vendor-accounts/onboarding/return}
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
